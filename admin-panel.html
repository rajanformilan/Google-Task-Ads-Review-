<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - Realtime Control</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Firebase App (the core Firebase SDK) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <!-- Firebase Realtime Database SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    :root { --primary: #2c3e50; --success: #27ae60; --accent: #3498db; --danger: #e74c3c; --purple: #8e44ad; }
    body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
    .container { max-width: 950px; margin: auto; }
    .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2, h3 { color: var(--primary); border-bottom: 2px solid #eee; padding-bottom: 10px; margin-top: 0; }
    input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 1rem; box-sizing: border-box; }
    button { background: var(--accent); color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-quick { background: var(--purple); }
    .table-container { overflow-x: auto; margin-top: 15px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    .balance-tag { font-weight: bold; color: var(--success); }
  </style>
</head>
<body>
  <div class="container">
    <h2><i class="fas fa-user-shield"></i> Admin Master Panel (Cloud)</h2>

    <!-- 1. LIVE USER DIRECTORY -->
    <div class="card">
      <h3><i class="fas fa-users"></i> Realtime User Balances</h3>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>User Name</th>
              <th>Mobile Number</th>
              <th>Cloud Balance</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <tr><td colspan="3" style="text-align:center;">Connecting to database...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 2. QUICK FIX SECTION -->
    <div class="card">
      <h3><i class="fas fa-bolt"></i> Quick Update (+9779824235220)</h3>
      <input type="number" id="quickAmount" placeholder="Amount to add (e.g. 350)">
      <button class="btn-quick" onclick="quickUpdate('+9779824235220')">Update 9824235220 Now</button>
    </div>

    <!-- 3. STANDARD UPDATER -->
    <div class="card">
      <h3><i class="fas fa-coins"></i> Manual Update</h3>
      <input type="text" id="targetMobile" placeholder="Enter Mobile Number">
      <input type="number" id="targetAmount" placeholder="Amount">
      <button onclick="updateBalance()">Update Balance</button>
      <p id="statusMsg" style="text-align:center; font-weight:bold; margin-top:10px;"></p>
    </div>
  </div>

  <script>
    // 1. YOUR FIREBASE CONFIGURATION
    // Replace these with your actual Firebase project details
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. READ USERS IN REALTIME
    db.ref('users').on('value', (snapshot) => {
      const users = snapshot.val();
      const userTableBody = document.getElementById("userTableBody");
      userTableBody.innerHTML = "";

      if (!users) {
        userTableBody.innerHTML = "<tr><td colspan='3' style='text-align:center;'>No users in cloud database.</td></tr>";
        return;
      }

      Object.keys(users).forEach(key => {
        const user = users[key];
        // Ensure we display correctly even if key is missing +977
        const displayKey = key.startsWith('9') ? '+977' + key : key;
        userTableBody.innerHTML += `
          <tr>
            <td><strong>${user.name || 'User'}</strong></td>
            <td>${displayKey}</td>
            <td class="balance-tag">Rs. ${user.balance || 0}</td>
          </tr>
        `;
      });
    });

    // 3. UPDATE LOGIC
    function quickUpdate(mobile) {
      const amount = parseFloat(document.getElementById("quickAmount").value);
      if(isNaN(amount)) return alert("Enter amount");
      applyUpdate(mobile, amount);
    }

    function updateBalance() {
      const mobile = document.getElementById("targetMobile").value.trim();
      const amount = parseFloat(document.getElementById("targetAmount").value);
      if(!mobile || isNaN(amount)) return alert("Fill all fields");
      applyUpdate(mobile, amount);
    }

    function applyUpdate(mobile, amount) {
      // Standardize the key to remove +977 for the database key
      const cleanKey = mobile.replace("+977", "").trim();
      const userRef = db.ref('users/' + cleanKey);

      userRef.get().then((snapshot) => {
        let currentBalance = 0;
        if (snapshot.exists()) {
          currentBalance = parseFloat(snapshot.val().balance) || 0;
        }

        userRef.update({
          balance: currentBalance + amount
        }).then(() => {
          document.getElementById("statusMsg").style.color = "green";
          document.getElementById("statusMsg").textContent = "✅ Cloud Update Successful!";
          // Clear inputs
          document.getElementById("quickAmount").value = "";
          document.getElementById("targetMobile").value = "";
          document.getElementById("targetAmount").value = "";
        });
      });
    }
  </script>
</body>
</html>
