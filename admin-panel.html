<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Review4Pay</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100">
  <div class="p-6 max-w-5xl mx-auto">
    <div class="flex justify-between items-center mb-10">
      <h1 class="text-3xl font-bold text-blue-500">Master Admin</h1>
      <button onclick="loadUsers()" class="bg-gray-700 hover:bg-gray-600 px-6 py-2 rounded-lg transition">Refresh List</button>
    </div>

    <div class="bg-gray-800 rounded-2xl shadow-2xl border border-gray-700 overflow-hidden">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-gray-700 text-gray-400 text-xs uppercase">
            <th class="p-5">User Information</th>
            <th class="p-5">Current Balance</th>
            <th class="p-5">Tasks</th>
            <th class="p-5">Balance Actions</th>
          </tr>
        </thead>
        <tbody id="user-table">
          <!-- User rows will load here -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const BASE_URL = "https://your-infinityfree-link.com/";

    async function loadUsers() {
      const res = await fetch(`${BASE_URL}admin_get_all.php`);
      const users = await res.json();
      const table = document.getElementById("user-table");
      table.innerHTML = "";

      users.forEach(user => {
        table.innerHTML += `
          <tr class="border-b border-gray-700 hover:bg-gray-750 transition">
            <td class="p-5">
              <p class="font-bold text-white">${user.name}</p>
              <p class="text-xs text-gray-500">${user.phone}</p>
            </td>
            <td class="p-5 text-xl font-mono text-green-400">Rs. ${user.balance}</td>
            <td class="p-5 text-gray-400">${user.tasks_completed}/10</td>
            <td class="p-5">
              <div class="flex gap-2">
                <input type="number" id="amt-${user.phone}" placeholder="Amount" class="w-20 p-2 bg-gray-900 border border-gray-600 rounded text-sm">
                <button onclick="updateBal('${user.phone}', 'add')" class="bg-green-600 hover:bg-green-500 px-3 py-1 rounded text-xs font-bold">ADD</button>
                <button onclick="updateBal('${user.phone}', 'deduct')" class="bg-red-600 hover:bg-red-500 px-3 py-1 rounded text-xs font-bold">DEDUCT</button>
              </div>
            </td>
          </tr>
        `;
      });
    }

    async function updateBal(phone, action) {
      const input = document.getElementById(`amt-${phone}`);
      let amount = parseFloat(input.value);
      if(!amount) return alert("Enter amount");

      if(action === 'deduct') amount = -amount;

      const res = await fetch(`${BASE_URL}admin_adjust_balance.php`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone, amount })
      });
      const result = await res.json();
      if(result.success) {
        alert("Success! Balance Updated.");
        loadUsers();
      }
    }
    loadUsers();
  </script>
</body>
</html>
