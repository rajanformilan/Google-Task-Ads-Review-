<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - Balance Manager</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root { --primary: #2c3e50; --success: #27ae60; --accent: #3498db; --danger: #e74c3c; }
    body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: auto; }
    .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2, h3 { color: var(--primary); border-bottom: 2px solid #eee; padding-bottom: 10px; }
    input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 1rem; box-sizing: border-box; }
    button { background: var(--accent); color: white; border: none; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
    .btn-quick { background: #8e44ad; margin-bottom: 10px; }
    .btn-logout { background: var(--danger); margin-top: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    .amt-plus { color: var(--success); font-weight: bold; }
    .amt-minus { color: var(--danger); font-weight: bold; }
    .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; color: white; font-weight: bold; }
    .bg-add { background: var(--success); }
    .bg-deduct { background: var(--danger); }
  </style>
</head>
<body>
  <div class="container">
    <h2><i class="fas fa-user-shield"></i> Admin Control Panel</h2>
    
    <div class="card">
      <h3><i class="fas fa-bolt"></i> Quick Fix for +9779824235220</h3>
      <input type="number" id="quickAmount" placeholder="Amount for 9824235220">
      <button class="btn-quick" onclick="quickUpdate('+9779824235220')">Update This Specific User Now</button>
    </div>

    <div class="card">
      <h3><i class="fas fa-coins"></i> Standard Add / Deduct</h3>
      <input type="text" id="targetMobile" placeholder="User Mobile Number">
      <input type="number" id="targetAmount" placeholder="Amount">
      <button onclick="updateAndLogBalance()">Update Balance Now</button>
      <p id="statusMsg" style="text-align:center; font-weight:bold; margin-top:10px;"></p>
    </div>

    <div class="card">
      <h3><i class="fas fa-history"></i> Admin Transaction History</h3>
      <table>
        <thead>
          <tr>
            <th>User / Mobile</th>
            <th>Action</th>
            <th>Amount</th>
            <th>Date & Time</th>
          </tr>
        </thead>
        <tbody id="adminLogBody"></tbody>
      </table>
    </div>

    <button class="btn-logout" onclick="logout()">Logout Admin</button>
  </div>

  <script>
    if (localStorage.getItem("isAdmin") !== "true") { window.location.href = "admin-login.html"; }

    function normalizeMobile(num) {
      return num.replace("+977", "").replace(/\s+/g, "").trim();
    }

    // Special function just for your current priority
    function quickUpdate(specificMobile) {
      const amount = parseFloat(document.getElementById("quickAmount").value);
      if(isNaN(amount)) return alert("Enter an amount!");
      executeBalanceUpdate(specificMobile, amount);
    }

    function updateAndLogBalance() {
      const rawMobile = document.getElementById("targetMobile").value.trim();
      const amount = parseFloat(document.getElementById("targetAmount").value);
      const mobile = normalizeMobile(rawMobile);

      const users = JSON.parse(localStorage.getItem("users") || "{}");
      let userKey = users[mobile] ? mobile : (users["+977" + mobile] ? "+977" + mobile : null);

      if(!userKey) return alert("यो मोबाइल नम्बर भएको युजर भेटिएन!");
      executeBalanceUpdate(userKey, amount);
    }

    function executeBalanceUpdate(userKey, amount) {
      const users = JSON.parse(localStorage.getItem("users") || "{}");
      
      // Ensure user exists in database before updating
      if(!users[userKey]) {
          // If the key strictly doesn't exist, we create a placeholder so the balance can be added
          users[userKey] = { name: "User " + userKey, balance: 0 };
      }

      users[userKey].balance = (parseFloat(users[userKey].balance) || 0) + amount;
      localStorage.setItem("users", JSON.stringify(users));

      const adminLogs = JSON.parse(localStorage.getItem("adminLogs") || "[]");
      adminLogs.push({
        name: users[userKey].name,
        mobile: userKey,
        type: amount > 0 ? "ADDED" : "DEDUCTED",
        amount: Math.abs(amount),
        time: new Date().toLocaleString()
      });
      localStorage.setItem("adminLogs", JSON.stringify(adminLogs));

      document.getElementById("statusMsg").textContent = `✅ Updated ${userKey}`;
      loadAdminLogs();
    }

    function loadAdminLogs() {
      const logBody = document.getElementById("adminLogBody");
      const logs = JSON.parse(localStorage.getItem("adminLogs") || "[]");
      logBody.innerHTML = logs.reverse().map(log => `
        <tr>
          <td><strong>${log.name}</strong><br><small>${log.mobile}</small></td>
          <td><span class="status-badge ${log.type === 'ADDED' ? 'bg-add' : 'bg-deduct'}">${log.type}</span></td>
          <td class="${log.type === 'ADDED' ? 'amt-plus' : 'amt-minus'}">Rs. ${log.amount}</td>
          <td>${log.time}</td>
        </tr>
      `).join('');
    }

    function logout() { localStorage.removeItem("isAdmin"); window.location.href = "admin-login.html"; }

    loadAdminLogs();
  </script>
</body>
</html>
