<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write Review - Review4Pay</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #0f172a; --accent: #2563eb; --warning: #fbbf24; --bg: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; color: #1e293b; }
        
        .header { background: var(--primary); color: white; padding: 1rem; display: flex; align-items: center; gap: 1rem; }
        .back-btn { color: white; text-decoration: none; }

        .container { max-width: 500px; margin: 1rem auto; padding: 0 1rem; }
        
        /* Location Header Card */
        .location-card { background: white; border-radius: 1rem; padding: 1rem; border: 1px solid #e2e8f0; display: flex; gap: 1rem; align-items: center; margin-bottom: 1.5rem; }
        .loc-img-small { width: 60px; height: 60px; border-radius: 0.5rem; object-fit: cover; }
        .loc-info h3 { margin: 0; font-size: 1rem; }
        .loc-info p { margin: 0.2rem 0 0; font-size: 0.75rem; color: #64748b; }

        /* Review Input Section */
        .write-section { background: white; border-radius: 1rem; padding: 1.5rem; border: 1px solid #e2e8f0; }
        .star-rating { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; justify-content: center; }
        .star-rating i { font-size: 2rem; color: #e2e8f0; cursor: pointer; transition: 0.2s; }
        .star-rating i.active { color: var(--warning); }

        .review-area { 
            width: 100%; border: 1px solid #e2e8f0; border-radius: 0.75rem; 
            padding: 1rem; box-sizing: border-box; font-family: inherit;
            font-size: 0.95rem; min-height: 150px; resize: none; margin-bottom: 1rem;
        }
        .review-area:focus { outline: 2px solid var(--accent); border-color: transparent; }

        .tips { background: #fff7ed; border: 1px solid #fed7aa; padding: 1rem; border-radius: 0.75rem; font-size: 0.8rem; color: #9a3412; margin-bottom: 1.5rem; }
        
        .btn-post { 
            width: 100%; background: #ea4335; color: white; border: none; 
            padding: 1rem; border-radius: 0.75rem; font-weight: 700; font-size: 1rem; 
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header class="header">
    <a href="index.html" class="back-btn"><i class="fas fa-times"></i></a>
    <div style="font-weight: 700;">Write a Review</div>
</header>

<div class="container">
    <div class="location-card">
        <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?w=100" class="loc-img-small">
        <div class="loc-info">
            <h3>Kathmandu Marriott Hotel</h3>
            <p><i class="fas fa-map-marker-alt"></i> Manbhawan, Kathmandu</p>
        </div>
    </div>

    <div class="write-section">
        <div class="star-rating" id="stars">
            <i class="fas fa-star" onclick="setRating(1)"></i>
            <i class="fas fa-star" onclick="setRating(2)"></i>
            <i class="fas fa-star" onclick="setRating(3)"></i>
            <i class="fas fa-star" onclick="setRating(4)"></i>
            <i class="fas fa-star" onclick="setRating(5)"></i>
        </div>

        <textarea class="review-area" placeholder="Describe your experience (quality, service, atmosphere)..."></textarea>

        <div class="tips">
            <strong><i class="fas fa-lightbulb"></i> Tip:</strong> Reviews with more than 50 characters are verified 2x faster by our Nepal team!
        </div>

        <button class="btn-post" onclick="redirectToGoogle()">
            <i class="fab fa-google"></i> Post on Google Maps
        </button>
    </div>
</div>

<script>
    let currentRating = 0;
    function setRating(n) {
        currentRating = n;
        const stars = document.getElementById('stars').children;
        for(let i=0; i<5; i++) {
            stars[i].classList.toggle('active', i < n);
        }
    }

    function redirectToGoogle() {
        if(currentRating === 0) {
            alert("Please select a star rating first.");
            return;
        }
        alert("Redirecting to the official Google Maps page... After posting, remember to take a screenshot for your Rs. 15, 20 reward!");
        // In a real app, this would open the specific Google Maps link
        window.location.href = "submision.html"; 
    }
</script>

</body>
</html>
