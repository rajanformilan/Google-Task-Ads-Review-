<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Submit Request - Review4Pay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-4">
  <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-xl mt-10">
    <h2 class="text-2xl font-bold text-center text-slate-800 mb-6">Request Funds</h2>
    
    <div class="bg-indigo-700 text-white p-5 rounded-xl text-center mb-6 shadow-inner">
      <p class="text-xs opacity-80 uppercase">Available Balance</p>
      <p class="text-2xl font-bold">Rs. <span id="balance">0.00</span></p>
    </div>

    <label class="block text-sm font-semibold mb-1">Request Type</label>
    <select id="type" onchange="toggleQR()" class="w-full p-3 bg-gray-50 border rounded-lg mb-4 focus:ring-2 focus:ring-indigo-500">
      <option value="Withdraw">💸 Withdraw (10% Tax)</option>
      <option value="Recharge">🔋 Recharge (Khalti/Bank)</option>
    </select>

    <div id="qr-box" class="hidden bg-yellow-50 border-2 border-dashed border-yellow-400 p-4 rounded-lg mb-4 text-sm text-yellow-800">
      <strong>Admin Details:</strong><br>
      Khalti: 9819210050 | Bank: 05410017510742 <br>Rajan Kandel<br>Nabil Bank Limited
    </div>

    <input type="text" id="method" placeholder="Payment Method (e.g. eSewa)" class="w-full p-3 border rounded-lg mb-4">
    <input type="number" id="amount" placeholder="Amount (Min. 1000)" class="w-full p-3 border rounded-lg mb-4">
    <input type="tel" id="number" placeholder="Your Wallet ID/Number" class="w-full p-3 border rounded-lg mb-6">

    <button onclick="submitRequest()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-4 rounded-xl font-bold transition shadow-lg">
      Submit & Notify Admin
    </button>

    <div id="msgBox" class="mt-4 hidden p-4 rounded-lg text-center font-semibold"></div>
  </div>

  <script>
    const BASE_URL = "https://your-infinityfree-link.com/";
    const userPhone = localStorage.getItem("loggedInUser");

    async function fetchBal() {
      const res = await fetch(`${BASE_URL}get_user_data.php?phone=${userPhone}`);
      const data = await res.json();
      if(data.success) document.getElementById("balance").textContent = data.balance;
    }

    function toggleQR() {
      const type = document.getElementById("type").value;
      document.getElementById("qr-box").classList.toggle("hidden", type !== "Recharge");
    }

    async function submitRequest() {
      const payload = {
        phone: userPhone,
        type: document.getElementById("type").value,
        amount: document.getElementById("amount").value,
        method: document.getElementById("method").value,
        accountNumber: document.getElementById("number").value
      };

      const res = await fetch(`${BASE_URL}process_request.php`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      
      const result = await res.json();
      const msgBox = document.getElementById("msgBox");
      msgBox.classList.remove("hidden");

      if(result.success) {
        msgBox.innerHTML = "✅ Request Sent! Check your email to confirm.";
        msgBox.className = "mt-4 p-4 rounded-lg text-center bg-green-100 text-green-700";
        fetchBal();
      } else {
        msgBox.innerHTML = "❌ Error: " + result.message;
        msgBox.className = "mt-4 p-4 rounded-lg text-center bg-red-100 text-red-700";
      }
    }
    fetchBal();
  </script>
</body>
</html>
