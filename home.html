<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Review4Pay - Earn Daily</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /* ... (Keep your existing CSS styles here) ... */
    :root { --primary: #2c3e50; --success: #27ae60; --vip: #8e44ad; --accent: #3498db; }
    body { font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; background: #f0f2f5; }
    .navbar { background: var(--primary); color: white; padding: 12px 20px; display: flex; justify-content: space-between; position: sticky; top: 0; z-index: 1000; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; max-width: 1000px; margin: 20px auto; padding: 0 15px; }
    .stat-card { background: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .hotel-container { max-width: 1100px; margin: 20px auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 15px; }
    .hotel-card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 6px 12px rgba(0,0,0,0.08); position: relative; }
    .hotel-card img { width: 100%; height: 180px; object-fit: cover; }
    .reward-pill { position: absolute; top: 10px; left: 10px; background: var(--success); color: white; padding: 5px 10px; border-radius: 20px; font-weight: bold; }
    .hotel-info { padding: 15px; text-align: center; }
    .btn-earn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; width: 100%; }
    #review-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 2000; }
    .modal-box { background: white; padding: 25px; border-radius: 15px; width: 90%; max-width: 400px; }
    .btn-submit { background: var(--success); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo"><i class="fas fa-coins"></i> Review4Pay</div>
    <ul class="nav-links">
      <li><a href="home.html">Home</a></li>
      <li><a href="history.html">History</a></li>
      <li><button onclick="logout()" style="background:none; border:none; color:white; cursor:pointer;">Logout</button></li>
    </ul>
  </nav>

  <div class="dashboard">
    <div class="stats-grid">
      <div class="stat-card">
        <i class="fas fa-user-circle"></i>
        <span class="stat-label">Member Name</span>
        <span class="stat-value"><span id="user-name">Loading...</span></span>
      </div>
      <div class="stat-card">
        <i class="fas fa-wallet"></i>
        <span class="stat-label">Balance</span>
        <span class="stat-value" style="color:var(--success)">Rs. <span id="balance-val">0</span></span>
      </div>
      <div class="stat-card">
        <i class="fas fa-tasks"></i>
        <span class="stat-label">Today's Tasks</span>
        <span class="stat-value"><span id="done-count">0</span> / 10</span>
      </div>
    </div>
  </div>

  <div class="hotel-container" id="hotel-list"></div>

  <!-- Review Modal -->
  <div id="review-modal">
    <div class="modal-box">
      <h2 id="m-hotel-name">Hotel Name</h2>
      <textarea id="review-text" rows="3" placeholder="Write your review..."></textarea>
      <button class="btn-submit" id="submit-btn">Submit & Get Paid</button>
      <button onclick="closeModal()" style="width:100%; margin-top:10px;">Cancel</button>
    </div>
  </div>

  <script>
    const userPhone = localStorage.getItem("loggedInUser");

    // 1. FETCH DATA FROM DATABASE ON LOAD
    async function loadUserData() {
        if (!userPhone) { window.location.href = "login.html"; return; }

        try {
            const response = await fetch(`get_user_data.php?phone=${userPhone}`);
            const data = await response.json();

            if (data.success) {
                document.getElementById("user-name").textContent = data.name;
                document.getElementById("balance-val").textContent = data.balance;
                document.getElementById("done-count").textContent = data.tasks_completed;
            }
        } catch (error) {
            console.error("Error loading data:", error);
        }
    }

    // 2. SUBMIT TASK & UPDATE DATABASE
    document.getElementById("submit-btn").addEventListener("click", async () => {
        const review = document.getElementById("review-text").value;
        if (review.length < 10) { alert("Review too short!"); return; }

        try {
            const response = await fetch('update_task.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: userPhone, reward: 65, fee: 50 })
            });
            const result = await response.json();

            if (result.success) {
                alert("Success! Your balance was updated.");
                closeModal();
                loadUserData(); // Refresh stats from server
            } else {
                alert(result.message);
            }
        } catch (error) {
            alert("Database connection failed.");
        }
    });

    // --- UI Helper Functions ---
    function openReview(name) {
      document.getElementById("m-hotel-name").textContent = name;
      document.getElementById("review-modal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("review-modal").style.display = "none";
      document.getElementById("review-text").value = "";
    }

    function logout() {
      localStorage.removeItem("loggedInUser");
      window.location.href = "login.html";
    }

    // Render Hotels (Placeholder loop)
    const list = document.getElementById("hotel-list");
    for(let i=1; i<=10; i++) {
        list.innerHTML += `
            <div class="hotel-card">
                <div class="reward-pill">Rs. 65</div>
                <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?w=500">
                <div class="hotel-info">
                    <h3>Premium Hotel #${i}</h3>
                    <button class="btn-earn" onclick="openReview('Hotel #${i}')">Start Task</button>
                </div>
            </div>`;
    }

    loadUserData();
  </script>
</body>
</html>
